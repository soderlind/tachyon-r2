name: On Release, Build release zip

on:
  release:
    types: [published]

jobs:
  build:
    name: Build release zip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage release files
        run: |
          mkdir -p /tmp/tachyon-r2
          rsync -a --exclude='.git/' --exclude-from='.distignore' . /tmp/tachyon-r2/

      - name: Archive release
        working-directory: /tmp
        run: zip -r ${{ github.workspace }}/tachyon-r2.zip tachyon-r2/

      - name: Upload zip to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" tachyon-r2.zip --clobber
